<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- OG: 이야기꾼 퀴즈 링크 미리보기 (한 페이지라 직접 적음) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="시계탑에 흐른 피(시계피) wiki 페이지 한글">
<meta property="og:title" content="이야기꾼 퀴즈 - 시계피 wiki">
<meta property="og:description" content="게임 기본기부터 에디션별 상황까지, 이야기꾼 실력을 시험하는 퀴즈 230문제 (공식 퀴즈 한국어판 + 마스터 이야기꾼 초고난도)">
<meta property="og:url" content="https://castleq.github.io/botc-wiki-ko/quiz.html">
<meta property="og:image" content="https://castleq.github.io/botc-wiki-ko/og/quiz.jpg">
<meta property="og:image:width" content="400">
<meta property="og:image:height" content="400">
<meta property="og:image:alt" content="이야기꾼 퀴즈">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://castleq.github.io/botc-wiki-ko/quiz.html">
<title>이야기꾼 퀴즈 - 시계피 wiki</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* 이야기꾼 퀴즈 — 공식 퀴즈(quiz.bloodontheclocktower.com)의 화면 값을 그대로 옮긴 것.
   원본 글꼴: 제목 Dumbledor(라틴 글자만 있음 → 한글은 성곡 세리프), 본문 Trade Gothic(→ Noto Sans KR).
   그림: quiz/img/ (원본에서 복사). 캐릭터 토큰은 원본 빈 토큰 + PG+ 아이콘 + 한국어 이름으로 새로 그린다. */
@font-face {
    font-family: "Dumbledor";
    src: url("quiz/fonts/dumbledor.woff2") format("woff2");
    font-display: swap;
}
/* 퀴즈는 본문 칸 위쪽에 붙여 화면 높이에 맞춘다 */
.page.page--quiz, .page.page--wide.page--quiz { padding: 0; margin-top: 0; }
.quiz {
    --q-danger: #B21418;
    --q-success: #6CB26A;
    --q-primary: #31153E;
    --q-fancy: #F1EAD9;
    --q-head: "Dumbledor", "KookminUniversitySunggokSerif", serif;
    background: #000 url("quiz/img/background-img2.webp");
    font-size: 14px;
    line-height: normal;
    word-break: keep-all;
    overflow: hidden;
}
.quiz h1, .quiz h2, .quiz h3 { font-weight: normal; border: 0; padding-top: 0; }
.quiz a { -webkit-tap-highlight-color: transparent; }
/* 위쪽 보라 막대: 원본의 로고 + 퀴즈 이름 (SNS 아이콘은 뺌) */
.quiz-bar {
    background-color: var(--q-primary);
    height: 86px;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}
.quiz-bar__logo { align-self: end; flex: none; }
.quiz-bar__logo img { display: block; width: 330px; max-width: 100%; height: auto; }
.quiz-bar__name { font-family: var(--q-head); color: #D1BB87; font-size: 15px; text-align: center; }
.quiz-bar__spacer { width: 330px; flex: none; }
/* 화면 전환: 원본 framer-motion (opacity 0→1, tween, anticipate, 0.5초) */
@keyframes quiz-fade { from { opacity: 0; } to { opacity: 1; } }
.quiz-screen { animation: quiz-fade 0.5s cubic-bezier(0.7, -0.4, 0.4, 1.4) both; }
.quiz-home, .quiz-select { min-height: calc(100vh - 86px); }

/* 원본 버튼: 양쪽 장식 + 테두리 상자, 비활성은 opacity 0.2 */
.q-button { display: inline-flex; flex-direction: row; text-align: center; align-items: center; text-decoration: none; }
.q-button[aria-disabled="true"] { opacity: 0.2; pointer-events: none; }
.q-button img { height: 28px; width: auto; }
.q-button img + span + img { transform: rotate(180deg); }
.q-button span {
    text-transform: uppercase;
    padding: 0.8rem 4rem;
    font-family: "Noto Sans KR", sans-serif;
    border: solid 2px var(--q-fancy);
    color: var(--q-fancy);
}
.q-button:hover span { background-color: var(--q-fancy); color: var(--q-primary); }
.q-button--light span { border-color: #BDA89A; color: #7B5D4E; }
.q-button--light:hover span { background-color: #BDA89A; color: #fff; }

/* 첫 화면 */
.quiz-home {
    text-align: center;
    color: #fff;
    background: url("quiz/img/bg_home.jpg") center bottom / 1440px repeat-y;
    padding-bottom: 60px;
}
.quiz-home__inner { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 60px 16px 0; }
.quiz-home__inner > img:first-child { width: 275px; height: auto; }
.quiz-home__title { margin-bottom: 10px; width: 167px; height: auto; }
.quiz-home h2 { font-family: var(--q-head); font-size: 1.5em; margin: 0.83em 0; color: #fff; filter: drop-shadow(3px 3px 4px #000); }

/* 퀴즈 고르기 */
.quiz-select {
    text-align: center;
    background: url("quiz/img/bg_beige_textured.webp") center / 1440px repeat-y;
    padding-bottom: 1px;
}
.quiz-select__title { margin: 20px 0 10px; width: 136px; height: 104px; }
.quiz-select h3 { color: #7B5D4E; font-family: var(--q-head); margin: 0 0 70px; font-size: 150%; }
.quiz-cards {
    display: flex;
    width: 100%;
    margin: 0 0 80px;
    padding: 0;
    list-style: none;
    flex-wrap: wrap;
    justify-content: center;
    gap: 100px;
    font-family: var(--q-head);
}
.quiz-card { display: block; position: relative; width: 218px; height: 350px; }
.quiz-card__ink {
    position: absolute;
    top: -80px;
    bottom: -80px;
    left: -100px;
    right: -100px;
    background-size: 100%;
    background-repeat: no-repeat;
    background-position: center;
}
.quiz-card__body {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    background-color: #F9F7F1;
    overflow: hidden;
}
.quiz-card__cover { width: 100%; display: flex; align-items: center; justify-content: center; padding: 20px 0; }
.quiz-card__cover img { width: 100%; }
.quiz-card__label { background-color: #F1EBDC; color: #7B5D4E; padding: 20px; font-size: 130%; }
.quiz-card__links { display: flex; flex-direction: column; align-items: center; flex-grow: 1; justify-content: space-around; padding: 10px 20px; }
.quiz-card__links a { display: block; width: 100%; color: #7B5D4E; font-family: "Noto Sans KR", sans-serif; font-size: 102%; text-decoration: none; padding: 5px 0; }
.quiz-card__links a:hover { color: var(--q-primary); }

/* 문제·결과 화면: 왼쪽 그리모어(원본 1024×824를 칸에 맞춰 축소) + 오른쪽 문제 칸 */
.quiz-play { display: flex; width: 100%; position: relative; }
.grimoire-box { flex: 1 1 auto; min-width: 0; position: relative; overflow: hidden; }
.grimoire {
    position: absolute;
    top: 0;
    left: 0;
    width: 1024px;
    height: 824px;
    transform-origin: 0 0;
    background: url("quiz/img/grimoire-bg.jpg") 0 0 / 100% 100%;
}
.quiz-panel-wrap {
    flex: 0 0 416px;
    display: flex;
    background: url("quiz/img/question-border.jpg") right / contain repeat-y;
}
.quiz-panel {
    flex-grow: 1;
    overflow: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-right: 40px;
    background-color: #FAF6E6;
}
.quiz-panel__title { padding-top: 15px; width: 100px; height: auto; }
.quiz-panel__leave { margin: 5px 0 20px; }
.quiz-panel__leave a { text-decoration: none; color: #7B5D4E; font-family: var(--q-head); }
.quiz-panel__leave a:hover { color: var(--q-primary); }
.question {
    width: 100%;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    padding: 10px 20px;
    text-align: left;
    color: #5C1F22;
}
.question h2 { text-align: center; padding-bottom: 5px; margin: 0.83em 10px 0; font-family: var(--q-head); font-size: 160%; }
.question h3 { font-weight: normal; margin: 2px 0; font-size: 1.17em; line-height: 1.5; white-space: pre-line; }
.answers { width: 100%; padding: 0; margin: 1em 0; }
.answer { margin: 4px; position: relative; border: solid 2px #BDA89A; }
.answer label { padding: 10px 15px; display: block; cursor: pointer; line-height: 1.5; }
.answer input { display: none; }
.answers:not(.is-answered) .answer:hover { background-color: #BDA89A; color: #fff; }
.is-answered .answer { color: #BDA89A; }
.is-answered .answer label { cursor: default; }
.is-answered .answer.is-correct { border-color: var(--q-success); color: inherit; }
.is-answered .answer.is-correct.is-selected { background-color: var(--q-success); color: #fff; }
.is-answered .answer.is-wrong { background-color: var(--q-danger); border-color: var(--q-danger); color: #fff; padding-right: 32px; }
.answer__mark { position: absolute; right: 15px; top: 10px; width: 0.7em; }
.answer-result { font-family: var(--q-head); margin: 2px 0 0; font-size: 1.5em; }
.answer-result.is-correct { color: var(--q-success); }
.answer-result.is-wrong { color: var(--q-danger); }
.answer-reason { font-style: italic; line-height: 1.6; }
.question__next { display: flex; justify-content: center; margin-top: auto; padding-top: 16px; }

/* 결과 */
.quiz-result { flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 30px; padding: 10px 20px 20px; color: #5C1F22; }
.quiz-result h2 { text-align: center; margin: 0.83em 10px 0; font-family: var(--q-head); font-size: 180%; }
.quiz-result h3 { font-weight: normal; font-style: italic; margin: 2px 0; line-height: 1.6; }
.quiz-result__token { position: relative; width: 194px; height: 194px; }
.quiz-result__token .shadow { position: absolute; width: 206px; height: 206px; left: 0; top: 0; opacity: 0.5; background: url("quiz/img/circle-shadow.webp") 0 0 / cover; }
.quiz-result__token .token { position: absolute; inset: 0; width: 100%; height: 100%; }
.result-bg { position: absolute; inset: 0; background: center / contain no-repeat; }

/* 토큰 (원본 배치 값: 캐릭터 138px, 알림 75px, 그림자 158/85px) */
.seat { position: absolute; display: flex; }
.seat-shadow { position: absolute; opacity: 0.3; background: url("quiz/img/circle-shadow.webp") 0 0 / cover; }
.token {
    position: absolute;
    border-radius: 50%;
    transition: transform 0.2s;
    background: url("quiz/img/token.webp") 0 0 / contain;
}
.token__icon { position: absolute; left: 20%; top: 14%; width: 60%; height: 60%; object-fit: contain; }
.token__name { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.token__name text { font-family: "KookminUniversitySunggokSerif", serif; font-size: 19px; fill: #2c1c14; letter-spacing: 0.05em; }
.token--reminder { background: #3b2350 radial-gradient(circle at 50% 40%, #5b3a78 0%, #3b2350 60%, #241333 100%); box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.6); }
.token--reminder .token__icon { left: 22%; top: 10%; width: 56%; height: 56%; }
.token--reminder .token__name text { fill: #fff; font-family: "Noto Sans KR", sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0; }
.seat.is-flipped > .token--character { transform: rotate(180deg); }
.seat.is-zoomed > .token--character { transform: scale(1.6); z-index: 2; }
.seat-name {
    position: absolute;
    bottom: -34px;
    width: 100%;
    padding: 10px 0;
    text-align: center;
    font-family: "Noto Sans KR", sans-serif;
    font-weight: bold;
    font-size: 14px;
    color: #fff;
    filter: drop-shadow(3px 3px 4px #000);
    white-space: nowrap;
}
.seat-shroud {
    position: absolute;
    top: 0;
    left: 50%;
    width: 55px;
    height: 77px;
    margin-left: -27px;
    background: url("quiz/img/shroud.webp") top center / contain no-repeat;
    pointer-events: none;
    z-index: 1;
}
.seat.is-zoomed .seat-shroud { z-index: 3; }
.seat-ability {
    display: none;
    position: absolute;
    top: 100%;
    left: 50%;
    width: 300px;
    margin: 70px 0 0 -150px;
    padding: 10px;
    text-align: center;
    color: #5C1F22;
    background-color: rgba(255, 255, 255, 0.95);
    border-radius: 10px;
    border: 1px solid #BDA89A;
    font-size: 14px;
    line-height: 1.5;
    z-index: 4;
    pointer-events: none;
}
.seat.is-zoomed .seat-ability { display: block; }
/* 그리모어 가장자리 토큰은 설명 상자가 밖으로 잘리지 않게 안쪽으로 붙인다 */
.seat--edge-left .seat-ability { left: 0; margin-left: -20px; }
.seat--edge-right .seat-ability { left: auto; right: 0; margin-left: 0; margin-right: -20px; }
.fabled-row { position: absolute; display: flex; top: 20px; right: 20px; height: 138px; width: 180px; transition: width 0.3s ease; }
.fabled-row .seat { top: 0; }
/* 이름 입력 · 공유 · 점수 비교 (도감 추가 기능) */
.quiz-name { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 4px 0 18px; }
.quiz-name label { font-family: var(--q-head); font-size: 16px; filter: drop-shadow(2px 2px 3px #000); }
.quiz-name input {
    width: 240px;
    padding: 9px 12px;
    font: inherit;
    font-size: 16px;
    text-align: center;
    color: var(--q-primary);
    background: var(--q-fancy);
    border: 2px solid #BDA89A;
}
.quiz-challenge { max-width: 520px; margin: 0 auto 6px; padding: 12px 16px; font-size: 16px; line-height: 1.6; background: rgba(0, 0, 0, 0.45); border: 1px solid #D1BB87; }
.quiz-challenge strong { color: #D1BB87; }
.quiz-card__links small { display: block; font-family: "Noto Sans KR", sans-serif; font-size: 12px; color: #9a8577; }
.quiz-share { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.quiz-share__done { min-height: 1.2em; font-size: 13px; color: var(--q-success); }
/* 오답일 때: 이 문제만 따로 여는 링크를 나눠 토론 */
.ask {
    display: flex;
    align-items: center;
    gap: 10px;
    width: calc(100% - 8px);
    margin: 4px 4px 8px;
    padding: 10px 15px;
    font: inherit;
    line-height: 1.5;
    text-align: left;
    color: #5C1F22;
    background: #F1EBDC;
    border: solid 2px #BDA89A;
    cursor: pointer;
    transition: background-color 0.2s, box-shadow 0.2s;
}
.ask:hover, .ask:focus-visible { background: #e9dcc4; box-shadow: 0 2px 6px rgba(92, 31, 34, 0.18); }
.ask { gap: 6px; }
.ask__emoji { font-size: 1em; line-height: 1; }
.ask__text { flex: 1; font-weight: bold; }
.ask__arrow { color: #7B5D4E; transition: transform 0.2s; }
.ask:hover .ask__arrow { transform: translateX(3px); }
.ask[aria-expanded="true"]:hover .ask__arrow { transform: translateY(3px); }
.ask-box { margin: 0 0 8px; padding: 10px 12px; background: #fff; border: 1px dashed #BDA89A; border-radius: 10px; font-size: 13px; }
.ask-box input { width: 100%; padding: 6px 8px; margin: 6px 0; font: inherit; font-size: 12.5px; color: #5C1F22; border: 1px solid #BDA89A; background: #FAF6E6; }
.ask-box button { padding: 6px 14px; font: inherit; font-size: 13px; color: #fff; background: #7B5D4E; border: 0; border-radius: 6px; cursor: pointer; }
.ask-box button:hover { background: var(--q-primary); }
.ask-box__done { margin-left: 8px; color: var(--q-success); }
/* 복수 선택 문항 · 문항 정보 줄 · 근거 링크 */
.answers--multi .answer label::before { content: "☐ "; }
.answers--multi .answer:has(input:checked) label::before { content: "☑ "; }
.answers:not(.is-answered) .answer:has(input:checked) { background-color: #BDA89A; color: #fff; }
.answer-refs { margin: 0 0 8px; padding-left: 18px; font-size: 13px; line-height: 1.6; }
.answer-refs a { color: #5C1F22; }
/* 해설 화면: 처리 후 마도서에서 바뀐 좌석 강조 + 바뀐 내용 목록 */
.grimoire-time { position: absolute; top: 12px; left: 12px; z-index: 5; padding: 4px 12px; border-radius: 6px; background: rgba(0, 0, 0, 0.7); color: #F1EAD9; font: bold 15px "Noto Sans KR", sans-serif; pointer-events: none; }
.seat.is-changed > .token--character { box-shadow: 0 0 0 6px #F5C542, 0 0 28px 10px rgba(245, 197, 66, 0.85); }
.grim-toggle { position: absolute; right: 12px; bottom: 12px; z-index: 5; padding: 6px 14px; font: bold 15px "Noto Sans KR", sans-serif; color: #31153E; background: #F5C542; border: 0; border-radius: 6px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); cursor: pointer; }
.grim-toggle:hover, .grim-toggle:focus-visible { background: #F1EAD9; }
/* 퀴즈 인트로: 화면 전체, 누르면 다음 문장 */
.quiz-intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    padding: 24px 16px;
    color: #F1EAD9;
    background: #000 url("quiz/img/background-img2.webp");
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}
.quiz-intro__line {
    max-width: 760px;
    margin: 0;
    font-family: var(--q-head);
    font-size: clamp(20px, 4.2vw, 32px);
    line-height: 1.6;
    text-align: center;
    word-break: keep-all;
    overflow-wrap: break-word;
    white-space: pre-line;
    transition: opacity 0.6s ease, filter 0.6s ease;
}
.quiz-intro__line.is-hidden { opacity: 0; filter: blur(12px); }
.quiz-intro__buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; transition: opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease; }
.quiz-intro__buttons.is-hidden { opacity: 0; transform: translateY(-16px); filter: blur(6px); visibility: hidden; }
.quiz-intro__buttons .q-button span { padding: 0.8rem 2rem; }
.quiz-intro__skip { position: absolute; top: 16px; right: 16px; padding: 6px 14px; font: 14px "Noto Sans KR", sans-serif; color: #F1EAD9; background: rgba(0, 0, 0, 0.4); border: 1px solid #D1BB87; border-radius: 6px; text-decoration: none; }
.quiz-intro__skip:hover { background: #F1EAD9; color: #31153E; }
.quiz-intro__tap { position: absolute; bottom: 20px; font-size: 13px; color: #9a8577; }
@media (prefers-reduced-motion: reduce) {
    .quiz-intro__line, .quiz-intro__buttons { transition: opacity 0.6s ease; }
    .quiz-intro__line.is-hidden, .quiz-intro__buttons.is-hidden { filter: none; transform: none; }
}
.quiz-loading { color: #fff; text-align: center; padding: 120px 16px; font-size: 18px; }

/* 낮은 화면: 첫 화면 그림을 줄여 시작 버튼까지 한 화면에 */
@media (max-height: 820px) {
    .quiz-home__inner { padding-top: 24px; }
    .quiz-home__inner > img:first-child { width: 170px; }
    .quiz-home__title { width: 120px; }
}
/* 좁은 화면: 문제 칸을 그리모어 아래로 */
@media (max-width: 899.98px) {
    .quiz-bar { height: 64px; padding: 0 12px; }
    .quiz-bar__logo img { width: 180px; }
    .quiz-bar__spacer { display: none; }
    .quiz-play { flex-direction: column; }
    .quiz-panel-wrap { flex-basis: auto; background: none; }
    .quiz-panel { margin-right: 0; }
    .result-bg { position: relative; height: 300px; }
    .quiz-cards { gap: 100px 40px; }
}
</style>
</head>
<body>
<nav class="tab-bar">
    <a href="./">시계탑에 흐른 피(시계피) wiki 페이지 한글</a>
</nav>
<main class="page page--quiz" id="page">
    <div class="quiz" id="quiz"><div class="quiz-loading">불러오는 중…</div></div>
    <p class="credit" style="padding: 0 16px;">공식 퀴즈 <a href="https://quiz.bloodontheclocktower.com/" target="_blank" rel="noopener">quiz.bloodontheclocktower.com</a>을 한국어로 옮긴 비공식 번역입니다. 예시 플레이어 이름은 한국어 이름으로 바꾸었습니다. '마스터 이야기꾼' 퀴즈는 원본에 없는, 이 도감에서 새로 만든 문제입니다.</p>
</main>

<script src="common.js"></script>
<script>
(function () {

    var W = window.WikiKo;
    var esc = W.esc;
    var root = document.getElementById("quiz");
    var quizzes = {};
    var order = [];
    var roles = {};
    var IMG = "quiz/img/";
    // 원본 그룹별 표지·잉크 색 (원본 wy 표)
    var COVERS = {
        fundamentals: { cover: "quiz-cover-default.webp", ink: "gold" },
        troublebrewing: { cover: "quiz-cover-trouble-brewing.webp", ink: "red" },
        sectsviolets: { cover: "quiz-cover-sects-violet.webp", ink: "purple" },
        badmoonrising: { cover: "quiz-cover-bad-moon-rising.webp", ink: "orange" },
        // 도감 자체 퀴즈 (원본에 없는 그룹이라 기본 표지·결과 그림)
        master: { cover: "quiz-cover-default.webp", ink: "red", result: "fundamentals" }
    };
    var TIMES = "<svg class=\"answer__mark\" viewBox=\"0 0 352 512\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M242.72 256l100.07-100.07c12.28-12.28 12.28-32.19 0-44.48l-22.24-22.24c-12.28-12.28-32.19-12.28-44.48 0L176 189.28 75.93 89.21c-12.28-12.28-32.19-12.28-44.48 0L9.21 111.45c-12.28 12.28-12.28 32.19 0 44.48L109.28 256 9.21 356.07c-12.28 12.28-12.28 32.19 0 44.48l22.24 22.24c12.28 12.28 32.2 12.28 44.48 0L176 322.72l100.07 100.07c12.28 12.28 32.2 12.28 44.48 0l22.24-22.24c12.28-12.28 12.28-32.19 0-44.48L242.72 256z\"/></svg>";

    // ── 답 저장 (원본과 같은 키: botcquiz_answer_<퀴즈>_<번호>). 저장이 막힌 브라우저에서는 메모리에만 ──
    var memory = {};
    function storeGet(key) {
        try {
            var value = window.localStorage.getItem(key);
            if (value !== null) return value;
        } catch (e) { /* 메모리 값 사용 */ }
        return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : null;
    }
    function storeSet(key, value) {
        memory[key] = value;
        try {
            window.localStorage.setItem(key, value);
        } catch (e) { /* 메모리 값 사용 */ }
    }
    var NAME_KEY = "botcquiz_name";
    function playerName() {
        return (storeGet(NAME_KEY) || "").trim();
    }
    function bestScore(quizID) {
        var n = parseInt(storeGet("botcquiz_best_" + quizID), 10);
        return isNaN(n) ? -1 : n;
    }
    function storeKey(quizID, index) {
        return "botcquiz_answer_" + quizID + "_" + index;
    }
    // 답은 고른 번호 배열(한 개 고르는 문제는 [n]), 안 풀었으면 null. 저장 값은 "1" 또는 복수 선택 "1,3"
    function getAnswer(quizID, index) {
        var value = null;
        try {
            value = window.localStorage.getItem(storeKey(quizID, index));
        } catch (e) {
            value = memory[storeKey(quizID, index)];
        }
        var list = String(value).split(",").map(Number).filter(function (n) { return n > -1; });
        return value !== null && value !== undefined && list.length ? list : null;
    }
    // 복수 선택은 정답을 모두 고르고 오답은 하나도 안 골랐을 때만 정답 (부분 점수 없음)
    function isRight(q, selected) {
        var want = [].concat(q.a);
        return !!selected && selected.length === want.length && want.every(function (n) { return selected.indexOf(n) > -1; });
    }
    function setAnswer(quizID, index, answer) {
        memory[storeKey(quizID, index)] = answer.join(",");
        try {
            window.localStorage.setItem(storeKey(quizID, index), answer.join(","));
        } catch (e) { /* 메모리 값 사용 */ }
    }
    function clearAnswers(quizID) {
        var prefix = storeKey(quizID, "");
        Object.keys(memory).forEach(function (key) {
            if (key.indexOf(prefix) === 0) delete memory[key];
        });
        try {
            for (var i = window.localStorage.length - 1; i > -1; i--) {
                var key = window.localStorage.key(i);
                if (key && key.indexOf(prefix) === 0) window.localStorage.removeItem(key);
            }
        } catch (e) { /* 없음 */ }
    }

    // ── 토큰 그리기 ──
    var curveId = 0;
    // alt: 진영 색이 반대인 그림(<id>_1.webp)
    function tokenHtml(id, kind, label, style, alt) {
        curveId += 1;
        var curve = "qc" + curveId;
        var src = alt ? W.iconUrl(id).replace(/_0\.webp$/, "_1.webp") : W.iconUrl(id);
        var icon = id ? "<img class=\"token__icon\" src=\"" + src + "\" alt=\"\" loading=\"lazy\">" : "";
        // PG+ 마도서 토큰과 같은 아래쪽 곡선 (viewBox 150)
        var name = label ? "<svg class=\"token__name\" viewBox=\"0 0 150 150\" aria-hidden=\"true\"><path id=\"" + curve + "\" d=\"M 13 75 C 13 160, 138 160, 138 75\" fill=\"none\"/>" +
            "<text text-anchor=\"middle\"><textPath href=\"#" + curve + "\" startOffset=\"50%\">" + esc(label) + "</textPath></text></svg>" : "";
        return "<div class=\"token token--" + kind + "\" style=\"" + style + "\" role=\"img\" aria-label=\"" + esc(label || "빈 토큰") + "\">" + icon + name + "</div>";
    }
    function roleName(id) {
        return roles[id] ? roles[id].name : "";
    }

    // 원본 배치 계산 (Cf: 각도·반지름 → 백분율 좌표)
    function circlePoint(angle, radius) {
        var a = angle * (Math.PI / 180);
        return { x: -radius * Math.sin(a) + 50, y: radius * Math.cos(a) + 50 };
    }
    // 원본: 9~12명은 직접 정한 자리
    var LAYOUTS = {
        9: [[50, 86], [29, 80], [15, 56], [21, 30], [38, 16], [62, 16], [79, 30], [85, 56], [71, 80]],
        10: [[50, 86], [30, 80], [16, 63], [16, 37], [30, 20], [50, 14], [70, 20], [84, 37], [84, 63], [70, 80]],
        11: [[50, 86], [32, 81], [18, 67], [15, 43], [25, 23], [41, 15], [59, 15], [75, 23], [85, 43], [82, 67], [68, 81]],
        12: [[50, 86], [34, 82], [20, 72], [14, 50], [20, 28], [34, 18], [50, 14], [66, 18], [80, 28], [86, 50], [80, 72], [66, 82]]
    };

    function seatHtml(player, index, count, fabled, changed) {
        var size = 138;
        var angle = 360 / count * index;
        var pos;
        var hideName = false;
        if (fabled) {
            var step = count > 1 ? 100 / (count - 1) : 0;
            pos = { x: step * index, y: 0 };
            hideName = index < count - 1;
        } else if (LAYOUTS[count]) {
            pos = { x: LAYOUTS[count][index][0], y: LAYOUTS[count][index][1] };
        } else {
            pos = circlePoint(angle, 36);
        }
        var low = (pos.y > 50 || Math.round(pos.y) === 50) ? 0.1 : 0;
        var shift = size * low;
        var style;
        if (fabled) {
            var left = pos.x === 100 ? "auto" : pos.x + "%";
            var right = pos.x === 100 ? "0" : "auto";
            var marginLeft = pos.x > 0 && pos.x < 100 ? "-70px" : "0";
            style = "width:" + size + "px;height:" + size + "px;top:0;left:" + left + ";right:" + right + ";margin-left:" + marginLeft;
        } else {
            style = "width:" + size + "px;height:" + size + "px;bottom:" + pos.y + "%;left:" + pos.x + "%;margin-left:-" + (size / 2) + "px;margin-bottom:-" + (size / 2 - shift) + "px";
        }
        function place(px, bottom, left, offset) {
            return "width:" + px + "px;height:" + px + "px;bottom:" + bottom + "%;left:" + left + "%;margin-left:-" + (px / 2) + "px;margin-bottom:-" + (px / 2 + offset) + "px";
        }
        var edge = fabled || pos.x > 70 ? " seat--edge-right" : (pos.x < 30 ? " seat--edge-left" : "");
        var html = "<div class=\"seat" + edge + (player.flipped && !player.altIcon ? " is-flipped" : "") + (changed ? " is-changed" : "") + "\" style=\"" + style + "\">";
        html += "<div class=\"seat-shadow\" style=\"" + place(158, 46, 50, 0) + "\"></div>";
        html += tokenHtml(player.token, "character", roleName(player.token), place(size, 50, 50, 0), player.altIcon);
        if (!hideName) {
            html += "<div class=\"seat-name\">" + esc(player.name) + "</div>";
        }
        (player.reminders || []).forEach(function (reminder, i) {
            var p = circlePoint(angle + 180, i === 0 ? 88 : 140);
            html += "<div class=\"seat-shadow\" style=\"" + place(85, p.y - 3, p.x, shift) + "\"></div>";
            html += tokenHtml(reminder.id, "reminder", reminder.text, place(75, p.y, p.x, shift));
        });
        if (player.dead) {
            html += "<div class=\"seat-shroud\"></div>";
        }
        var ability = roles[player.token] ? roles[player.token].ability : "";
        if (ability) {
            html += "<div class=\"seat-ability\">" + esc(ability) + "</div>";
        }
        return html + "</div>";
    }

    // 마도서 가운데 토큰(플레이어 자리에 놓이지 않는 것, 예: 역병 의사로 이야기꾼이 얻은 능력)
    function centerHtml(center) {
        return (center || []).map(function (c, i) {
            var left = 50 + (i - (center.length - 1) / 2) * 16;
            var html = "<div class=\"seat seat--center\" style=\"width:138px;height:138px;bottom:50%;left:" + left + "%;margin-left:-69px;margin-bottom:-40px\">" +
                "<div class=\"seat-shadow\" style=\"width:158px;height:158px;left:-10px;bottom:-10px\"></div>" +
                tokenHtml(c.token, "character", roleName(c.token), "width:138px;height:138px;left:0;bottom:0");
            (c.reminders || []).forEach(function (r, j) {
                html += tokenHtml(r.id, "reminder", r.text, "width:75px;height:75px;left:" + (31 + (j - ((c.reminders.length - 1) / 2)) * 80) + "px;bottom:-90px");
            });
            var ability = roles[c.token] ? roles[c.token].ability : "";
            return html + (ability ? "<div class=\"seat-ability\">" + esc(ability) + "</div>" : "") + "</div>";
        }).join("");
    }

    // 처리 전 → 처리 후에서 좌석마다 바뀐 것: 캐릭터·진영·사망/부활·알림 토큰
    function isEvil(p) {
        var team = roles[p.token] ? roles[p.token].team : "";
        return (team === "minion" || team === "demon") !== !!p.flipped;
    }
    function seatChanges(before, after) {
        function key(r) { return r.id + "|" + r.text; }
        function label(r) { return (roleName(r.id) ? roleName(r.id) + ": " : "") + r.text; }
        return after.map(function (a, i) {
            var b = before[i] || {};
            var items = [];
            if (a.token !== b.token) items.push("캐릭터 변경(" + roleName(b.token) + "→" + roleName(a.token) + ")");
            if (isEvil(a) !== isEvil(b)) items.push(isEvil(a) ? "진영 전환(선→악)" : "진영 전환(악→선)");
            if (!!a.dead !== !!b.dead) items.push(a.dead ? "사망" : "부활");
            var was = (b.reminders || []).map(key);
            var now = (a.reminders || []).map(key);
            // 알림 토큰: 뺀 것(−) 다음 더한 것(+)
            (b.reminders || []).forEach(function (r) { if (now.indexOf(key(r)) < 0) items.push("−" + label(r)); });
            (a.reminders || []).forEach(function (r) { if (was.indexOf(key(r)) < 0) items.push("+" + label(r)); });
            return items;
        });
    }

    // compare: 해설 화면의 처리 전/후 { before, after, showBefore }
    function grimoireHtml(players, center, compare, time) {
        var changes = compare ? seatChanges(compare.before, compare.after) : [];
        var fabled = players.filter(function (p) { return p.fabled; });
        var seated = players.filter(function (p) { return !p.fabled; });
        var html = "<div class=\"grimoire-box\">" + (time ? "<div class=\"grimoire-time\">" + esc(time) + "</div>" : "") + "<div class=\"grimoire\">";
        html += seated.map(function (p, i) { return seatHtml(p, i, seated.length, false, changes[i] && changes[i].length > 0); }).join("");
        if (fabled.length) {
            html += "<div class=\"fabled-row\" data-count=\"" + fabled.length + "\">" + fabled.map(function (p, i) { return seatHtml(p, i, fabled.length, true); }).join("") + "</div>";
        }
        html += centerHtml(center) + "</div>";
        if (compare) {
            // 버튼 글은 지금 보고 있는 화면 이름 (누르면 서로 바뀜)
            html += "<button type=\"button\" class=\"grim-toggle\" aria-label=\"" + (compare.showBefore ? "문제 보기 중, 눌러서 정답 보기" : "정답 보기 중, 눌러서 문제 보기") + "\">" +
                (compare.showBefore ? "문제 보기" : "정답 보기") + "</button>";
        }
        return html + "</div>";
    }

    // 그리모어(1024×824)를 칸에 맞춰 축소. 넓은 화면에서는 브라우저 높이(보라 막대 제외)에도 맞춰 스크롤 없이 한 화면에 들어오게 하고, 문제 칸 높이도 같이 맞춘다.
    function fitGrimoire() {
        var box = root.querySelector(".grimoire-box");
        if (!box) return;
        var stage = box.querySelector(".grimoire");
        var stacked = window.matchMedia("(max-width: 899.98px)").matches;
        var barHeight = root.querySelector(".quiz-bar").offsetHeight;
        var scale = box.clientWidth / 1024;
        if (!stacked) scale = Math.min(scale, (window.innerHeight - barHeight) / 824);
        var height = Math.round(824 * scale);
        box.style.height = height + "px";
        stage.style.transform = "translateX(" + Math.max(0, (box.clientWidth - 1024 * scale) / 2) + "px) scale(" + scale + ")";
        var wrap = root.querySelector(".quiz-panel-wrap");
        if (wrap) {
            wrap.style.height = stacked ? "" : height + "px";
        }
    }
    window.addEventListener("resize", fitGrimoire);

    // 토큰 확대(원본: 마우스를 올리면 1.6배) — 터치 화면은 누르면 확대/해제
    function bindSeats() {
        Array.prototype.forEach.call(root.querySelectorAll(".seat"), function (seat) {
            var token = seat.querySelector(".token--character");
            token.addEventListener("mouseenter", function () { seat.classList.add("is-zoomed"); });
            token.addEventListener("mouseleave", function () { seat.classList.remove("is-zoomed"); });
            token.addEventListener("click", function () { seat.classList.toggle("is-zoomed"); });
        });
        var row = root.querySelector(".fabled-row");
        if (row) {
            var count = parseInt(row.getAttribute("data-count"), 10);
            row.addEventListener("mouseenter", function () { if (count > 1) row.style.width = (130 * count) + "px"; });
            row.addEventListener("mouseleave", function () { row.style.width = ""; });
        }
    }

    function button(href, label, enabled, light) {
        return "<a class=\"q-button" + (light ? " q-button--light" : "") + "\" href=\"" + href + "\"" + (enabled ? "" : " aria-disabled=\"true\" tabindex=\"-1\"") + ">" +
            "<img src=\"" + IMG + "button-decoration.webp\" alt=\"\" role=\"presentation\"><span>" + esc(label) + "</span>" +
            "<img src=\"" + IMG + "button-decoration.webp\" alt=\"\" role=\"presentation\"></a>";
    }

    function bar(name) {
        return "<div class=\"quiz-bar\"><a class=\"quiz-bar__logo\" href=\"#/\"><img src=\"" + IMG + "logo_text.webp\" width=\"330\" height=\"75\" alt=\"Blood on the Clocktower\"></a>" +
            "<div class=\"quiz-bar__name\">" + esc(name || "") + "</div><div class=\"quiz-bar__spacer\"></div></div>";
    }

    function quizName(quiz) {
        return quiz.group + " - " + quiz.difficulty;
    }

    // ── 화면 ──
    // 공유 링크로 들어온 사람에게 보이는 화면: "○○님은 … n점입니다." + [나도 해보기]
    function landingScreen(quiz, score, name) {
        return bar(quizName(quiz)) + "<div class=\"quiz-screen quiz-home\"><div class=\"quiz-home__inner\">" +
            "<img src=\"" + IMG + "botc_head.webp\" width=\"275\" height=\"295\" alt=\"\">" +
            "<img class=\"quiz-home__title\" src=\"" + IMG + "quiz_title_text.webp\" width=\"167\" height=\"127\" alt=\"The Quiz\">" +
            "<div class=\"quiz-challenge\"><strong>" + esc(name) + "</strong>님은 <strong>" + esc(quizName(quiz)) + "</strong>에서 " +
            score + "/" + quiz.questions.length + "점입니다.</div>" +
            button("quiz.html", "나도 해보기", true, false) + "</div></div>";
    }

    // 첫 화면
    function homeScreen() {
        var intro = "<h2>게임 속 여러 모호한 상호작용에서 정답을 찾아보세요.<br>이야기꾼으로서 첫 게임을 진행하기 전에 실력을 시험해 보거나,<br>플레이어로서 게임을 이해하는 데 도움이 될 거예요.</h2>";
        return bar("") + "<div class=\"quiz-screen quiz-home\"><div class=\"quiz-home__inner\">" +
            "<img src=\"" + IMG + "botc_head.webp\" width=\"275\" height=\"295\" alt=\"\">" +
            "<img class=\"quiz-home__title\" src=\"" + IMG + "quiz_title_text.webp\" width=\"167\" height=\"127\" alt=\"The Quiz\">" +
            intro +
            "<div class=\"quiz-name\"><label for=\"quiz-name\">이름</label><input id=\"quiz-name\" maxlength=\"12\" autocomplete=\"nickname\" value=\"" + esc(playerName()) + "\"></div>" +
            button("#/select", "시작하기", !!playerName(), false) + "</div></div>";
    }

    // 시작 버튼: 이름이 비어 있으면 비활성 (흐리게 + 누를 수 없음)
    function bindHome() {
        var input = root.querySelector("#quiz-name");
        if (!input) return;
        var start = root.querySelector(".quiz-home .q-button");
        input.addEventListener("input", function () {
            var empty = !input.value.trim();
            start.setAttribute("aria-disabled", empty ? "true" : "false");
            start.tabIndex = empty ? -1 : 0;
        });
        start.addEventListener("click", function (event) {
            var name = input.value.trim();
            if (!name) {
                event.preventDefault();
                return;
            }
            storeSet(NAME_KEY, name);
        });
        input.addEventListener("keydown", function (event) {
            if (event.key === "Enter") start.click();
        });
    }

    function selectScreen() {
        var groups = [];
        var byGroup = {};
        order.forEach(function (id) {
            var quiz = quizzes[id];
            if (!byGroup[quiz.groupKey]) {
                byGroup[quiz.groupKey] = { label: quiz.group, key: quiz.groupKey, items: [] };
                groups.push(byGroup[quiz.groupKey]);
            }
            byGroup[quiz.groupKey].items.push(quiz);
        });
        var html = bar("") + "<div class=\"quiz-screen quiz-select\">" +
            "<img class=\"quiz-select__title\" src=\"" + IMG + "quiz_title_text.webp\" width=\"136\" height=\"104\" alt=\"The Quiz\">" +
            "<h3>퀴즈 종류를 고르세요</h3><ul class=\"quiz-cards\">";
        groups.forEach(function (group) {
            var look = COVERS[group.key] || COVERS.fundamentals;
            html += "<li class=\"quiz-card\">" +
                "<div class=\"quiz-card__ink\" style=\"background-image:url('" + IMG + "ink-blotch-" + look.ink + "-top.webp')\"></div>" +
                "<div class=\"quiz-card__ink\" style=\"background-image:url('" + IMG + "ink-blotch-" + look.ink + "-bottom.webp')\"></div>" +
                "<div class=\"quiz-card__body\"><div class=\"quiz-card__cover\"><img src=\"" + IMG + look.cover + "\" alt=\"\"></div>" +
                "<div class=\"quiz-card__label\">" + esc(group.label) + "</div><div class=\"quiz-card__links\">" +
                group.items.map(function (quiz) {
                    var best = bestScore(quiz.id);
                    return "<a href=\"#/" + quiz.id + (quiz.intro ? "/intro" : "/question-1") + "\">" + esc(quiz.difficulty) +
                        (best > -1 ? "<small>최고 " + best + "/" + quiz.questions.length + "</small>" : "") + "</a>";
                }).join("") + "</div></div></li>";
        });
        return html + "</ul></div>";
    }

    // single: 공유 링크로 연 문제 하나(#/<퀴즈>/q/<번호>) — 답은 퀴즈 진행에 저장하지 않는다
    var singleAnswer = null;
    var showBefore = false; // 해설 화면에서 처리 전 마도서를 보는 중
    function questionUrl(quiz, num) {
        return "https://castleq.github.io/botc-wiki-ko/quiz.html#/" + quiz.id + "/q/" + num;
    }
    function questionScreen(quiz, num, single) {
        var q = quiz.questions[num - 1];
        var selected = single ? singleAnswer : getAnswer(quiz.id, num - 1);
        var answered = !!selected;
        var want = [].concat(q.a);
        var total = quiz.questions.length;
        var html = "<div class=\"question\"><h2>문제 " + num + "/" + total + "</h2><div>" +
            "<h3>" + esc(q.q) + "</h3>" +
            "</div>";
        html += "<ul class=\"answers" + (q.multi ? " answers--multi" : "") + (answered ? " is-answered" : "") + "\">";
        q.o.forEach(function (text, i) {
            var picked = answered && selected.indexOf(i) > -1;
            var wrong = picked && want.indexOf(i) < 0;
            var cls = "answer";
            if (want.indexOf(i) > -1) cls += " is-correct";
            if (picked) cls += " is-selected";
            if (wrong) cls += " is-wrong";
            html += "<div class=\"" + cls + "\"><input type=\"" + (q.multi ? "checkbox" : "radio") + "\" name=\"answer\" id=\"item-" + i + "\" value=\"" + i + "\"" + (answered ? " disabled" : "") + (picked ? " checked" : "") + ">" +
                (wrong ? TIMES : "") +
                "<label for=\"item-" + i + "\">" + esc(text) + "</label></div>";
        });
        html += "</ul>";
        if (q.multi && !answered) {
            html += "<div class=\"question__next\">" + button(window.location.hash, "답 확인", false, true) + "</div></div>";
            return html;
        }
        if (answered) {
            var right = isRight(q, selected);
            html += "<h2 class=\"answer-result " + (right ? "is-correct" : "is-wrong") + "\">" + (right ? "정답!" : "오답") + "</h2>";
            html += "<p class=\"answer-reason\">" + esc(q.r) + "</p>";
            if (q.refs && q.refs.length) html += "<ul class=\"answer-refs\">" + q.refs.map(function (ref) { return "<li>" + refHtml(ref) + "</li>"; }).join("") + "</ul>";
            if (!right) {
                html += "<button type=\"button\" class=\"ask\" aria-expanded=\"false\"><span class=\"ask__emoji\" aria-hidden=\"true\">🤔</span>" +
                    "<span class=\"ask__text\">왜 틀렸는지 모르겠어요</span><span class=\"ask__arrow\" aria-hidden=\"true\">→</span></button>" +
                    "<div class=\"ask-box\" hidden>이 문제만 바로 열리는 링크예요. 단톡방에 올리고 같이 토론해 보세요!" +
                    "<input type=\"text\" readonly value=\"" + esc(questionUrl(quiz, num)) + "\" aria-label=\"이 문제 링크\">" +
                    "<button type=\"button\">링크 공유하기</button><span class=\"ask-box__done\" aria-live=\"polite\"></span></div>";
            }
        }
        if (single) {
            html += "<div class=\"question__next\">" + button("quiz.html", "이 퀴즈 처음부터 풀기", answered, true) + "</div></div>";
            return html;
        }
        var nextHref = num < total ? "#/" + quiz.id + "/question-" + (num + 1) : "#/" + quiz.id + "/results";
        html += "<div class=\"question__next\">" + button(answered ? nextHref : window.location.hash, num < total ? "다음" : "완료!", answered, true) + "</div></div>";
        return html;
    }

    // 근거 한 줄: "[이름](주소) — 설명" 꼴의 링크만 살리고 나머지는 글자 그대로
    function refHtml(ref) {
        return esc(ref).replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, function (all, text, url) {
            return "<a href=\"" + url.replace("https://castleq.github.io/botc-wiki-ko/", "") + "\" target=\"_blank\" rel=\"noopener\">" + text + "</a>";
        });
    }

    // 문제 화면의 마도서: 답을 고른 뒤 처리 후 마도서가 있으면 그것을 (바뀐 좌석 강조)
    function questionGrimoire(q, answered) {
        if (!answered || !q.playersAfter) return grimoireHtml(q.players, q.center, null, q.time);
        return grimoireHtml(showBefore ? q.players : q.playersAfter, q.center, {
            before: q.players, after: q.playersAfter, showBefore: showBefore
        }, q.time);
    }

    // 퀴즈 인트로: 한 번에 한 문장, 누르면 다음. 처음 시작할 때만(카드에서 들어올 때) 보여 준다
    function introScreen(quiz) {
        var seen = !!storeGet("botcquiz_intro_" + quiz.id);
        var start = "#/" + quiz.id + "/question-1";
        return "<div class=\"quiz-intro\" role=\"dialog\" aria-label=\"퀴즈 소개\" tabindex=\"-1\">" +
            (seen ? "<a class=\"quiz-intro__skip\" href=\"" + start + "\">건너뛰기</a>" : "") +
            "<p class=\"quiz-intro__line is-hidden\" aria-live=\"polite\"></p>" +
            "<div class=\"quiz-intro__buttons is-hidden\">" + quiz.intro.buttons.map(function (label) { return button(start, label, true, false); }).join("") + "</div>" +
            "<div class=\"quiz-intro__tap\">화면을 누르면 다음으로 넘어갑니다</div></div>";
    }
    var introKeys = null;
    function bindIntro(quiz) {
        var box = root.querySelector(".quiz-intro");
        if (!box) return;
        var lines = quiz.intro.lines.concat(quiz.intro.question);
        var line = box.querySelector(".quiz-intro__line");
        var buttons = box.querySelector(".quiz-intro__buttons");
        var index = -1;
        var busy = false;
        function next() {
            if (busy || index >= lines.length) return;
            index += 1;
            if (index === lines.length) {
                // 마지막 문장은 남겨 두고 버튼만 나타나게
                storeSet("botcquiz_intro_" + quiz.id, "1");
                buttons.classList.remove("is-hidden");
                box.querySelector(".quiz-intro__tap").hidden = true;
                buttons.querySelector("a").focus();
                return;
            }
            busy = true;
            var first = index === 0;
            line.classList.add("is-hidden");
            setTimeout(function () {
                line.textContent = lines[index];
                line.classList.remove("is-hidden");
                busy = false;
            }, first ? 30 : 600);
        }
        box.addEventListener("click", function (event) {
            if (!event.target.closest("a")) next();
        });
        introKeys = function (event) {
            if ((event.key === " " || event.key === "Enter") && !event.target.closest("a")) {
                event.preventDefault();
                next();
            }
        };
        document.addEventListener("keydown", introKeys);
        box.focus();
        next();
    }

    function playScreen(quiz, players, content, leaveLabel, extra) {
        return bar(quizName(quiz)) + "<div class=\"quiz-screen quiz-play\">" + (extra || grimoireHtml(players)) +
            "<div class=\"quiz-panel-wrap\"><div class=\"quiz-panel\">" +
            "<img class=\"quiz-panel__title\" src=\"" + IMG + "quiz_title_text.webp\" width=\"167\" height=\"127\" alt=\"The Quiz\">" +
            content + "<div class=\"quiz-panel__leave\"><a href=\"#/select\">" + esc(leaveLabel) + "</a></div></div></div></div>";
    }

    function resultsScreen(quiz) {
        var score = 0;
        var answeredCount = 0;
        quiz.questions.forEach(function (q, i) {
            var a = getAnswer(quiz.id, i);
            if (a) answeredCount += 1;
            if (a && isRight(q, a)) score += 1;
        });
        var result = quiz.results[score] || { text: "", token: "" };
        if (score > bestScore(quiz.id)) storeSet("botcquiz_best_" + quiz.id, String(score));
        var name = playerName();
        var content = "<div class=\"quiz-result\"><h2>" + (name ? esc(name) + "님의 " : "") + "점수<br>" + score + "/" + answeredCount + "</h2><div><h3>" + esc(result.text) + "</h3></div>" +
            "<div class=\"quiz-result__token\"><div class=\"shadow\"></div>" + tokenHtml(result.token, "character", roleName(result.token), "") + "</div>" +
            "<div class=\"quiz-share\">" + button(window.location.hash, "결과 공유하기", true, true) + "<div class=\"quiz-share__done\" aria-live=\"polite\"></div></div>" +
            button("#/" + quiz.id + "/question-1", "다시 도전하기", true, true) + "</div>";
        shareData = {
            text: "[이야기꾼 퀴즈] " + (name || "익명") + "님은 " + quizName(quiz) + "에서 " + score + "/" + quiz.questions.length + "점입니다.",
            url: "https://castleq.github.io/botc-wiki-ko/quiz.html#/" + quiz.id + "/score/" + score + "/" + encodeURIComponent(name || "익명")
        };
        var bg = "<div class=\"grimoire-box result-box\"><div class=\"grimoire\" style=\"background:url('" + IMG + "result-" + ((COVERS[quiz.groupKey] || {}).result || quiz.groupKey) + ".webp') center / cover\"></div></div>";
        return playScreen(quiz, [], content, "다른 퀴즈 풀기", bg);
    }

    // 결과 공유: 휴대폰은 공유 창, 아니면 복사
    var shareData = null;
    function share(data, done) {
        if (navigator.share) {
            navigator.share({ title: "이야기꾼 퀴즈", text: data.text, url: data.url }).catch(function () { /* 취소 */ });
            return;
        }
        var all = data.text + " " + data.url;
        var copied = navigator.clipboard ? navigator.clipboard.writeText(all) : Promise.reject();
        copied.then(function () {
            done.textContent = "복사했어요! 단톡방에 붙여 넣어 보세요.";
        }, function () {
            window.prompt("아래 문구를 복사하세요", all);
        });
    }
    function bindShare() {
        var link = root.querySelector(".quiz-share .q-button");
        if (link && shareData) {
            var data = shareData;
            link.addEventListener("click", function (event) {
                event.preventDefault();
                share(data, root.querySelector(".quiz-share__done"));
            });
        }
        var ask = root.querySelector(".ask");
        if (ask) {
            var box = root.querySelector(".ask-box");
            ask.addEventListener("click", function () {
                box.hidden = !box.hidden;
                ask.setAttribute("aria-expanded", box.hidden ? "false" : "true");
                ask.querySelector(".ask__arrow").textContent = box.hidden ? "→" : "↓";
                if (!box.hidden) box.querySelector("input").select();
            });
            box.querySelector("button").addEventListener("click", function () {
                share({ text: "[이야기꾼 퀴즈] 이 문제, 왜 답이 이거일까요? 🤔 같이 풀어 보고 이야기해요!", url: box.querySelector("input").value }, box.querySelector(".ask-box__done"));
            });
        }
    }

    // ── 주소(#/…)에 따라 화면 그리기 ──
    function render() {
        var hash = window.location.hash.replace(/^#\/?/, "");
        var parts = hash.split("/");
        var quiz = Object.prototype.hasOwnProperty.call(quizzes, parts[0]) ? quizzes[parts[0]] : null;
        var html;
        shareData = null;
        if (introKeys) document.removeEventListener("keydown", introKeys);
        introKeys = null;
        if (!render.keep) showBefore = false;
        if (!hash) {
            html = homeScreen();
        } else if (quiz && parts[1] === "score") {
            // 공유 링크: #/<퀴즈>/score/<점수>/<이름>
            var shared = Math.min(Math.max(parseInt(parts[2], 10) || 0, 0), quiz.questions.length);
            var sharedName = "";
            try {
                sharedName = decodeURIComponent(parts.slice(3).join("/")).trim().slice(0, 12);
            } catch (e) { /* 잘못된 주소 */ }
            html = landingScreen(quiz, shared, sharedName || "익명");
        } else if (quiz && parts[1] === "vs") {
            // 예전(두 사람 비교) 공유 링크는 첫 화면으로
            window.location.replace("#/");
            return;
        } else if (quiz && quiz.intro && parts[1] === "intro") {
            html = introScreen(quiz);
        } else if (hash === "select") {
            html = selectScreen();
        } else if (quiz && /^question-\d+$/.test(parts[1] || "")) {
            var num = parseInt(parts[1].slice(9), 10);
            if (num < 1 || num > quiz.questions.length) {
                window.location.replace("#/" + quiz.id + "/question-1");
                return;
            }
            if (num === 1 && !render.keep) {
                clearAnswers(quiz.id);
            }
            render.keep = false;
            var q = quiz.questions[num - 1];
            html = playScreen(quiz, null, questionScreen(quiz, num), "현재 퀴즈 나가기", questionGrimoire(q, !!getAnswer(quiz.id, num - 1)));
        } else if (quiz && parts[1] === "q" && /^\d+$/.test(parts[2] || "") && parts[2] >= 1 && parts[2] <= quiz.questions.length) {
            if (!render.keep) singleAnswer = null;
            render.keep = false;
            var one = parseInt(parts[2], 10);
            html = playScreen(quiz, null, questionScreen(quiz, one, true), "다른 퀴즈 풀기", questionGrimoire(quiz.questions[one - 1], !!singleAnswer));
        } else if (quiz && parts[1] === "results") {
            // 원본: 안 푼 문제가 있으면 그 문제로
            for (var i = 0; i < quiz.questions.length; i++) {
                if (!getAnswer(quiz.id, i)) {
                    window.location.replace("#/" + quiz.id + "/question-" + (i + 1));
                    return;
                }
            }
            html = resultsScreen(quiz);
        } else if (quiz) {
            window.location.replace("#/" + quiz.id + "/question-1");
            return;
        } else {
            html = homeScreen();
        }
        root.innerHTML = html;
        fitGrimoire();
        bindSeats();
        bindAnswers();
        bindHome();
        bindShare();
        if (quiz && parts[1] === "intro") bindIntro(quiz);
    }

    function bindAnswers() {
        var list = root.querySelector(".answers");
        if (!list) return;
        var multi = list.classList.contains("answers--multi");
        var check = multi && !list.classList.contains("is-answered") ? root.querySelector(".question__next .q-button") : null;
        function picked() {
            return Array.prototype.map.call(list.querySelectorAll("input:checked"), function (input) { return parseInt(input.value, 10); });
        }
        list.addEventListener("change", function () {
            if (!multi) {
                save(picked());
            } else if (check) {
                check.setAttribute("aria-disabled", picked().length ? "false" : "true");
                check.tabIndex = picked().length ? 0 : -1;
            }
        });
        if (check) {
            check.addEventListener("click", function (event) {
                event.preventDefault();
                if (picked().length) save(picked());
            });
        }        var toggle = root.querySelector(".grim-toggle");
        if (toggle) {
            toggle.addEventListener("click", function () {
                showBefore = !showBefore;
                redraw();
            });
        }
    }
    // 고른 답 저장 → 같은 화면을 해설과 함께 다시 그리기
    function save(answer) {
        var parts = window.location.hash.replace(/^#\/?/, "").split("/");
        if (parts[1] === "q") {
            singleAnswer = answer;
        } else {
            setAnswer(parts[0], parseInt(parts[1].slice(9), 10) - 1, answer);
        }
        redraw();
    }
    function redraw() {
        var panel = root.querySelector(".quiz-panel");
        var scrollTop = panel ? panel.scrollTop : 0;
        // 같은 문제를 다시 그리되 1번 문제의 초기화는 하지 않고, 화면 전환 효과도 없이
        render.keep = true;
        render();
        var screen = root.querySelector(".quiz-screen");
        if (screen) screen.style.animation = "none";
        var newPanel = root.querySelector(".quiz-panel");
        if (newPanel) newPanel.scrollTop = scrollTop;
    }

    window.addEventListener("hashchange", function () {
        render();
        var top = root.getBoundingClientRect().top + window.pageYOffset - 8;
        if (window.pageYOffset > top) window.scrollTo(0, top);
    });

    Promise.all([
        fetch("quiz/data.json").then(function (r) { return r.json(); }),
        W.getJSON("guide/data/roles.json").catch(function () { return {}; })
    ]).then(function (data) {
        data[0].quizzes.forEach(function (quiz) {
            quizzes[quiz.id] = quiz;
            order.push(quiz.id);
        });
        roles = data[1];
        render();
    }).catch(function () {
        root.innerHTML = "<div class=\"quiz-loading\">퀴즈를 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.</div>";
    });

}());
</script>
</body>
</html>
