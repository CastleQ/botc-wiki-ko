<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BOTC Wiki 한글번역 페이지</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Gowun+Batang&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* 판 페이지 — 공식 위키 판 문서(pivot 스킨)와 같은 구조·모양.
   제목 → [오른쪽 정보 상자 #edition-details: 판 로고 + 유형별 캐릭터 표] / [본문: 줄거리 → 목차 → 게임 방식 → 유형별 아이콘 격자].
   넓은 화면은 본문 3 : 정보 상자 1 두 칸, 좁은 화면은 정보 상자가 제목 아래로 먼저 온다.
   줄거리·게임 방식은 PG+ guide/data/pages/<판>.json 번역. 여행자는 위키와 같이 판 페이지에 넣지 않는다(여행자 유형 페이지에 판별로 있음).
   값은 위키 스타일시트(skins.pivot)에서 옮겼다: 제목 #5C1F22, h2 21px + #BDA89A 밑줄, 상자 배경 rgba(255,255,255,.75) + #BDA89A 테두리. */
.edition-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 24px; }
.edition-main { color: var(--wiki-maroon); font-size: 15px; }
.edition-main p { margin: 0 0 1em; }
#edition-details {
    background-color: rgba(255, 255, 255, 0.75);
    border: 1px solid var(--wiki-border);
    padding: 1.5em 0 0.3em;
    margin-bottom: 1.5em;
    text-align: center;
}
#edition-details .edition-logo { display: block; width: 200px; height: 200px; margin: 0 auto 1em; object-fit: contain; }
#edition-details-characters { width: 100%; border-collapse: collapse; font-size: 15px; line-height: 1.6; }
#edition-details-characters td { padding: 0 0.6em 1.1em; vertical-align: top; text-align: left; }
.edition-details-characters-title { text-align: right !important; font-weight: bold; color: #000; white-space: nowrap; width: 45%; }
#edition-details-characters a { display: block; color: #2a5aa0; text-decoration: none; }
#edition-details-characters a:hover { text-decoration: underline; }
.story--synopsis p { font-style: italic; font-family: "Gowun Batang", serif; }
@media (min-width: 900px) {
    .edition-layout { grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); }
    .edition-main { grid-column: 1; grid-row: 1; }
    #edition-details { grid-column: 2; grid-row: 1; align-self: start; }
}
</style>
</head>
<body>
<nav class="tab-bar">
    <a href="./">BOTC Wiki 한글번역 페이지</a>
</nav>
<main class="page page--wide" id="page"></main>

<script src="common.js"></script>
<script>
(function () {

    var W = window.WikiKo;
    var esc = W.esc;
    var page = document.getElementById("page");
    var id = new URLSearchParams(window.location.search).get("id") || "";
    var edition = null;
    W.EDITIONS.forEach(function (item) {
        if (item.id === id) {
            edition = item;
        }
    });

    function render(catalog, story) {
        var sections = W.editionSections(catalog, edition.id);
        var byId = W.indexById(catalog);
        var storySections = story ? story.sections : [];
        // 목차: 위키와 같이 줄거리 · 게임 방식 · 주민 · 외지인 · 하수인 · 악마 순
        var toc = storySections.map(function (section) {
            return { anchor: section.key, title: section.title };
        }).concat(sections.map(function (section, index) {
            return { anchor: "team-" + index, title: section.title };
        }));
        var html = "<nav class=\"crumbs\"><a href=\"./\">← 메인으로</a></nav>";

        document.title = edition.name + " — BOTC Wiki 한글번역 페이지";
        html += "<h1 class=\"title\">" + esc(edition.name) + "</h1>";
        html += "<div class=\"edition-layout\">";

        // 오른쪽 정보 상자: 판 로고 + 유형별 캐릭터 (이름을 세로로)
        html += "<aside id=\"edition-details\">";
        html += "<img class=\"edition-logo\" src=\"" + edition.logo + "\" alt=\"" + esc(edition.alt) + "\">";
        html += "<table id=\"edition-details-characters\">" + sections.map(function (section) {
            return "<tr><td class=\"edition-details-characters-title\">" + esc(section.title) + "</td><td>" +
                section.entries.map(function (entry) {
                    return "<a href=\"" + W.pageUrl(entry.id) + "\">" + esc(entry.name) + "</a>";
                }).join("") + "</td></tr>";
        }).join("") + "</table>";
        html += "</aside>";

        html += "<div class=\"edition-main\">";
        storySections.forEach(function (section, index) {
            html += "<section class=\"story story--" + esc(section.key) + "\"><h2 id=\"" + esc(section.key) + "\">" + esc(section.title) + "</h2>" +
                section.blocks.map(function (block) {
                    return "<p>" + W.richText(block.p || "", byId) + "</p>";
                }).join("") + "</section>";
            // 위키처럼 첫 구역(줄거리) 바로 뒤에 목차
            if (index === 0) {
                html += "<nav id=\"toc\"><div class=\"toctitle\">목차</div><ol>" + toc.map(function (item, n) {
                    return "<li><a href=\"#" + item.anchor + "\"><span class=\"tocnumber\">" + (n + 1) + "</span>" + esc(item.title) + "</a></li>";
                }).join("") + "</ol></nav>";
            }
        });
        html += sections.map(function (section, index) {
            return "<h2 id=\"team-" + index + "\">" + esc(section.title) + "</h2>" + W.grid(section.entries);
        }).join("");
        html += "</div></div>";

        if (story) {
            html += "<div class=\"credit\">이 페이지의 줄거리·게임 방식은 Blood on the Clocktower 공식 위키 문서(판 " + esc(story.source.oldid) +
                ")를 제작사 TPI의 Community Created Content 정책에 의거하여 한국어로 번역한 비공식 번역입니다. " +
                "<a href=\"https://wiki.bloodontheclocktower.com/" + esc(encodeURIComponent(story.source.page)) + "\" target=\"_blank\" rel=\"noopener\">원문(영어) 보기</a></div>";
        } else {
            html += W.CREDIT;
        }
        page.innerHTML = html;
    }

    if (!edition) {
        page.innerHTML = W.notFoundHtml("없는 에디션", "메인에서 에디션을 다시 골라 주세요.") + W.CREDIT;
        return;
    }

    // 판 문서 번역이 없거나 못 읽어도 목록은 보여 준다.
    Promise.all([
        W.getJSON("guide/data/catalog.json"),
        W.getJSON("guide/data/pages/" + edition.id + ".json").catch(function () { return null; })
    ])
        .then(function (data) {
            render(data[0], data[1]);
        })
        .catch(function () {
            page.innerHTML = W.notFoundHtml("목록을 불러오지 못했습니다", "잠시 뒤 다시 열어 주세요.") + W.CREDIT;
        });

}());
</script>
</body>
</html>
