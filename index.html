<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BOTC Wiki 한글번역 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;700&family=Gowun+Batang&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* 메인 — 공식 위키 Main Page 구조: 에디션별(판 로고 3) + 유형별(유형 아이콘 7). 검색창은 도감에서 더한 것. */
.search {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid var(--wiki-border);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.85);
    color: #222;
}
.search-result { margin: 0.5em 0; font-size: 14px; color: #6d5a4f; }
[hidden] { display: none !important; }
/* 공식 위키 로고 (PG+ guide/img/logo.png — 위키 원본과 같은 파일) */
.main-logo { display: block; width: 160px; height: auto; margin: 0.4em 0 0; }
</style>
</head>
<body>
<nav class="tab-bar">
    <a href="./">BOTC Wiki 한글번역 페이지</a>
</nav>
<main class="page">
    <img class="main-logo" src="/pocket-grimoire/guide/img/logo.png" alt="Blood on the Clocktower">
    <h1 class="title">MAIN PAGE</h1>
    <p class="lead">시계탑에 흐른 피 공식 위키의 캐릭터 문서를 한국어로 옮긴 비공식 도감입니다. 캐릭터 이름과 능력은 정발 한국어판 용어를 따릅니다.</p>
    <input class="search" id="search" type="search" placeholder="찾기" autocomplete="off">
    <div id="results" hidden>
        <p class="search-result" id="search-result"></p>
        <div id="result-grid"></div>
    </div>
    <div id="sections">
        <h2>에디션별 캐릭터</h2>
        <ul class="tiles" id="editions"></ul>
        <h2>유형별 캐릭터</h2>
        <ul class="tiles" id="types"></ul>
    </div>
    <div id="credit"></div>
</main>

<script src="common.js"></script>
<script>
(function () {

    var W = window.WikiKo;
    var esc = W.esc;
    var search = document.getElementById("search");
    var results = document.getElementById("results");
    var searchResult = document.getElementById("search-result");
    var resultGrid = document.getElementById("result-grid");
    var sections = document.getElementById("sections");
    var catalog = [];
    var failed = false;

    function tile(href, image, alt, name) {
        return "<li><a href=\"" + href + "\"><img src=\"" + image + "\" alt=\"" + esc(alt) + "\">" + esc(name) + "</a></li>";
    }

    document.getElementById("editions").innerHTML = W.EDITIONS.map(function (edition) {
        return tile("edition.html?id=" + edition.id, edition.logo, edition.alt, edition.name);
    }).join("");
    document.getElementById("types").innerHTML = W.TYPES.map(function (type) {
        return tile("type.html?id=" + type.id, W.BASE + "guide/img/generic_" + type.id + ".webp", "", type.name);
    }).join("");
    document.getElementById("credit").outerHTML = W.CREDIT;

    // 검색: 띄어쓰기를 무시하고 이름에 글자가 들어 있으면 보여 준다. 검색 중에는 판·유형 타일을 숨긴다.
    function filter() {
        var query = search.value.replace(/\s/g, "");
        results.hidden = !query;
        sections.hidden = !!query;
        if (!query) {
            return;
        }
        if (!catalog.length) {
            searchResult.textContent = failed ? "목록을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요." : "목록을 불러오는 중…";
            resultGrid.innerHTML = "";
            return;
        }
        var found = catalog.filter(function (entry) {
            return entry.name.replace(/\s/g, "").indexOf(query) !== -1;
        });
        searchResult.textContent = found.length ? "찾은 캐릭터 " + found.length + "개" : "찾는 캐릭터가 없습니다.";
        resultGrid.innerHTML = W.grid(found);
    }

    search.addEventListener("input", filter);

    W.getJSON("guide/data/catalog.json")
        .then(function (data) {
            catalog = Array.isArray(data) ? data : [];
            filter();
        })
        .catch(function () {
            failed = true;
            filter();
        });

}());
</script>
</body>
</html>
