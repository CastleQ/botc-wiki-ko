<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BOTC Wiki 한글번역 페이지</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Gowun+Batang&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* 메인 — 공식 위키 Main Page 구조: 에디션별(판 로고 3) + 유형별(유형 아이콘 7). 검색창은 도감에서 더한 것. */
.search {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid var(--wiki-border);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.85);
    color: #222;
}
.search-result { margin: 0.5em 0; font-size: 14px; color: #6d5a4f; }
[hidden] { display: none !important; }
/* 공식 위키 로고 (PG+ guide/img/logo.png — 위키 원본과 같은 파일) */
.main-logo { display: block; width: 160px; height: auto; margin: 0.4em 0 0; }
/* 넓은 화면: 위키 Main Page — 로고·검색은 왼쪽 메뉴에 있으므로 본문에서 숨기고,
   판 로고는 한 줄 4칸(위키 large-3), 유형 아이콘은 한 줄 6칸(위키 large-2)에 4개 + 3개 두 줄 */
@media (min-width: 1024px) {
    .main-logo, .search { display: none; }
    .tiles--editions { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; }
    .tiles--editions img { width: 220px; height: 220px; }
    .tiles--types { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px 16px; }
    .tiles--types img { width: 150px; height: 150px; }
    .tiles a { font-size: 18px; }
}
</style>
</head>
<body>
<nav class="tab-bar">
    <a href="./">BOTC Wiki 한글번역 페이지</a>
</nav>
<main class="page">
    <img class="main-logo" src="/pocket-grimoire/guide/img/logo.png" alt="Blood on the Clocktower">
    <h1 class="title">MAIN PAGE</h1>
    <p class="lead">시계탑에 흐른 피 공식 위키의 캐릭터 문서를 한국어로 옮긴 비공식 도감입니다. 캐릭터 이름과 능력은 정발 한국어판 용어를 따릅니다.</p>
    <input class="search" id="search" type="search" placeholder="찾기" autocomplete="off">
    <div id="results" hidden>
        <p class="search-result" id="search-result"></p>
        <div id="result-grid"></div>
    </div>
    <div id="sections">
        <h2>에디션별 캐릭터</h2>
        <ul class="tiles tiles--editions" id="editions"></ul>
        <h2>유형별 캐릭터</h2>
        <ul class="tiles tiles--types" id="types"></ul>
        <ul class="tiles tiles--types" id="types-special"></ul>
    </div>
    <div id="credit"></div>
</main>

<script src="common.js"></script>
<script>
(function () {

    var W = window.WikiKo;
    var esc = W.esc;
    var search = document.getElementById("search");
    var results = document.getElementById("results");
    var searchResult = document.getElementById("search-result");
    var resultGrid = document.getElementById("result-grid");
    var sections = document.getElementById("sections");
    var catalog = [];
    var failed = false;

    function tile(href, image, alt, name) {
        return "<li><a href=\"" + href + "\"><img src=\"" + image + "\" alt=\"" + esc(alt) + "\">" + esc(name) + "</a></li>";
    }

    document.getElementById("editions").innerHTML = W.EDITIONS.map(function (edition) {
        return tile("edition.html?id=" + edition.id, edition.logo, edition.alt, edition.name);
    }).join("");
    // 위키와 같이 첫 줄 주민·외지인·하수인·악마, 둘째 줄 여행자·전설·설화
    function typeTile(type) {
        return tile("type.html?id=" + type.id, W.BASE + "guide/img/generic_" + type.id + ".webp", "", type.name);
    }
    document.getElementById("types").innerHTML = W.TYPES.slice(0, 4).map(typeTile).join("");
    document.getElementById("types-special").innerHTML = W.TYPES.slice(4).map(typeTile).join("");
    document.getElementById("credit").outerHTML = W.CREDIT;

    // 검색: 띄어쓰기를 무시하고 이름에 글자가 들어 있으면 보여 준다. 검색 중에는 판·유형 타일을 숨긴다.
    function filter() {
        var query = search.value.replace(/\s/g, "");
        results.hidden = !query;
        sections.hidden = !!query;
        if (!query) {
            return;
        }
        if (!catalog.length) {
            searchResult.textContent = failed ? "목록을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요." : "목록을 불러오는 중…";
            resultGrid.innerHTML = "";
            return;
        }
        var found = catalog.filter(function (entry) {
            return entry.name.replace(/\s/g, "").indexOf(query) !== -1;
        });
        searchResult.textContent = found.length ? "찾은 캐릭터 " + found.length + "개" : "찾는 캐릭터가 없습니다.";
        resultGrid.innerHTML = W.grid(found);
    }

    // 본문 검색창(휴대폰)과 왼쪽 메뉴 검색창(PC)을 같은 검색으로 묶는다. 다른 페이지 메뉴에서 찾으면 ./?q=… 로 온다.
    var sideSearch = document.getElementById("side-search");
    var initial = new URLSearchParams(window.location.search).get("q") || "";
    search.value = initial;
    search.addEventListener("input", function () {
        if (sideSearch) {
            sideSearch.value = search.value;
        }
        filter();
    });
    if (sideSearch) {
        sideSearch.addEventListener("input", function () {
            search.value = sideSearch.value;
            filter();
        });
        sideSearch.form.addEventListener("submit", function (event) {
            event.preventDefault();
            filter();
        });
    }

    W.getJSON("guide/data/catalog.json")
        .then(function (data) {
            catalog = Array.isArray(data) ? data : [];
            filter();
        })
        .catch(function () {
            failed = true;
            filter();
        });

}());
</script>
</body>
</html>
