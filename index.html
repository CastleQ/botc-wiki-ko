<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>포켓 그리모어 캐릭터 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;700&family=Gowun+Batang&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* 메인 페이지 — 목록은 PG+ 배포본의 guide/data/catalog.json(판 → 유형 → 공식 순번으로 정렬됨)을 그대로 묶는다. */
.intro { font-size: 15px; color: #222; margin: 0.6em 0 1em; }
.search {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid var(--wiki-border);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.85);
    color: #222;
}
.search-result { margin-top: 0.5em; font-size: 14px; color: #6d5a4f; }
.group { margin-top: 1.5em; }
.group__head { display: flex; align-items: center; gap: 10px; }
.group__head img { width: 56px; height: 56px; object-fit: contain; }
.group__head h2 { flex: 1; margin: 0.6em 0 0.4em; }
.group__count { font-size: 14px; color: #6d5a4f; }
h3.team {
    font-family: "Song Myung", serif;
    font-weight: normal;
    font-size: 18px;
    color: var(--wiki-maroon);
    margin: 0.9em 0 0.3em;
}
.grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 6px;
}
.grid a {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 2px 6px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    font-size: 13px;
    line-height: 1.3;
    text-align: center;
}
.grid a:hover, .grid a:focus-visible { background: rgba(255, 255, 255, 0.55); }
.grid img { width: 64px; height: 64px; object-fit: contain; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<nav class="tab-bar">
    <a href="./">포켓 그리모어 캐릭터 도감 <small>(비공식 한국어 번역)</small></a>
</nav>
<main class="page">
    <h1 class="title">캐릭터 도감</h1>
    <p class="intro">시계탑에 흐른 피 공식 위키의 캐릭터 문서를 한국어로 옮긴 비공식 도감입니다. 캐릭터 이름과 능력은 정발 한국어판 용어를 따릅니다.</p>
    <input class="search" id="search" type="search" placeholder="캐릭터 이름으로 찾기 (예: 세탁부)" autocomplete="off">
    <p class="search-result" id="search-result" hidden></p>
    <div id="list"><p class="notfound">목록을 불러오는 중…</p></div>
    <div class="credit">이 사이트의 캐릭터 문서는 Blood on the Clocktower 공식 위키를 제작사 TPI의 Community Created Content 정책에 의거하여 한국어로 번역한 것으로, 제작사와 관계없는 비공식 번역입니다. <a href="https://wiki.bloodontheclocktower.com/" target="_blank" rel="noopener">원문 위키(영어) 보기</a></div>
</main>

<script src="common.js"></script>
<script>
(function () {

    var W = window.WikiKo;
    var esc = W.esc;
    var list = document.getElementById("list");
    var search = document.getElementById("search");
    var searchResult = document.getElementById("search-result");

    function card(entry) {
        return "<li data-name=\"" + esc(entry.name.replace(/\s/g, "")) + "\">" +
            "<a class=\"role--" + W.side(entry.team) + "\" href=\"" + W.pageUrl(entry.id) + "\">" +
            "<img src=\"" + W.iconUrl(entry.id) + "\" alt=\"\" loading=\"lazy\">" + esc(entry.name) + "</a></li>";
    }

    function render(catalog) {
        var html = "";
        W.GROUPS.forEach(function (group) {
            var members = catalog.filter(function (entry) {
                return W.groupOf(entry) === group.key;
            });
            if (!members.length) {
                return;
            }
            html += "<section class=\"group\" data-group>";
            html += "<div class=\"group__head\">";
            if (group.logo) {
                html += "<img src=\"" + W.BASE + group.logo + "\" alt=\"\">";
            }
            html += "<h2>" + esc(group.title) + "</h2><span class=\"group__count\">" + members.length + "</span></div>";
            W.TEAM_ORDER.forEach(function (team) {
                var inTeam = members.filter(function (entry) {
                    return entry.team === team;
                });
                if (!inTeam.length) {
                    return;
                }
                // 전설·설화 묶음은 유형이 하나뿐이라 유형 제목을 따로 달지 않는다.
                html += "<div data-team>";
                if (group.key !== team) {
                    html += "<h3 class=\"team\">" + esc(W.TEAM_NAMES[team]) + "</h3>";
                }
                html += "<ul class=\"grid\">" + inTeam.map(card).join("") + "</ul></div>";
            });
            html += "</section>";
        });
        list.innerHTML = html;
    }

    // 검색: 띄어쓰기를 무시하고 이름에 글자가 들어 있으면 남긴다. 빈 칸만 남은 유형·묶음은 숨긴다.
    function filter() {
        var query = search.value.replace(/\s/g, "");
        var shown = 0;
        Array.prototype.forEach.call(list.querySelectorAll("li[data-name]"), function (item) {
            var match = !query || item.getAttribute("data-name").indexOf(query) !== -1;
            item.hidden = !match;
            if (match) {
                shown += 1;
            }
        });
        Array.prototype.forEach.call(list.querySelectorAll("[data-team], [data-group]"), function (box) {
            box.hidden = !box.querySelector("li:not([hidden])");
        });
        searchResult.hidden = !query;
        searchResult.textContent = shown ? "찾은 캐릭터 " + shown + "개" : "찾는 캐릭터가 없습니다.";
    }

    W.getJSON("guide/data/catalog.json")
        .then(function (catalog) {
            render(catalog);
            search.addEventListener("input", filter);
            if (search.value) {
                filter();
            }
        })
        .catch(function () {
            list.innerHTML = "<p class=\"notfound\">목록을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.</p>";
        });

}());
</script>
</body>
</html>
