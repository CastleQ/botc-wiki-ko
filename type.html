<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BOTC Wiki 한글번역 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;700&family=Gowun+Batang&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="tab-bar">
    <a href="./">BOTC Wiki 한글번역 페이지</a>
</nav>
<main class="page" id="page"></main>

<script src="common.js"></script>
<script>
// 유형 페이지 — 공식 위키의 분류(주민·외지인·하수인·악마)와 여행자·전설·설화 문서.
// 위키는 이름만 나열하지만 도감은 아이콘과 이름을 함께 보여 준다. 묶는 방법은 common.js의 typeSections.
(function () {

    var W = window.WikiKo;
    var esc = W.esc;
    var page = document.getElementById("page");
    var id = new URLSearchParams(window.location.search).get("id") || "";
    var name = Object.prototype.hasOwnProperty.call(W.TEAM_NAMES, id) ? W.TEAM_NAMES[id] : "";

    // 위키 소개글이 있는 유형(여행자)은 위키 문서와 같이: 제목 → 소개글 → 목차 → 묶음별 격자.
    // 소개글이 없는 유형은 캐릭터 수 한 줄 → 묶음별 격자.
    function render(catalog, story) {
        var sections = W.typeSections(catalog, id);
        var count = sections.reduce(function (sum, section) {
            return sum + section.entries.length;
        }, 0);
        var html = "<nav class=\"crumbs\"><a href=\"./\">← 메인으로</a></nav>";

        document.title = name + " — BOTC Wiki 한글번역 페이지";
        html += "<h1 class=\"title\">" + esc(name) + "</h1>";
        if (story) {
            var byId = W.indexById(catalog);
            var paragraphs = function (section) {
                return section.blocks.map(function (block) {
                    return "<p>" + W.richText(block.p || "", byId) + "</p>";
                }).join("");
            };
            // 제목 없는 구역(소개글)은 목차 앞, 제목 있는 구역(진행 방법 등)은 목차 뒤 — 위키와 같은 순서
            var lead = story.sections.filter(function (section) { return !section.title; });
            var titled = story.sections.filter(function (section) { return section.title; });
            var toc = titled.map(function (section) {
                return { anchor: section.key, title: section.title };
            }).concat(sections.map(function (section, index) {
                return { anchor: "group-" + index, title: section.title };
            }));
            html += "<div class=\"wiki-text\">" + lead.map(paragraphs).join("") + "</div>";
            html += "<nav id=\"toc\"><div class=\"toctitle\">목차</div><ol>" + toc.map(function (item, n) {
                return "<li><a href=\"#" + item.anchor + "\"><span class=\"tocnumber\">" + (n + 1) + "</span>" + esc(item.title) + "</a></li>";
            }).join("") + "</ol></nav>";
            html += titled.map(function (section) {
                return "<section class=\"wiki-text\"><h2 id=\"" + esc(section.key) + "\">" + esc(section.title) + "</h2>" + paragraphs(section) + "</section>";
            }).join("");
        } else {
            html += "<p class=\"lead\">" + esc(name) + " 캐릭터 " + count + "개</p>";
        }
        html += sections.map(function (section, index) {
            return (section.title ? "<h2 id=\"group-" + index + "\">" + esc(section.title) + "</h2>" : "") + W.grid(section.entries);
        }).join("");
        if (story) {
            html += "<div class=\"credit\">이 페이지의 설명글은 Blood on the Clocktower 공식 위키 문서(판 " + esc(story.source.oldid) +
                ")를 제작사 TPI의 Community Created Content 정책에 의거하여 한국어로 번역한 비공식 번역입니다. " +
                "<a href=\"https://wiki.bloodontheclocktower.com/" + esc(encodeURIComponent(story.source.page)) + "\" target=\"_blank\" rel=\"noopener\">원문(영어) 보기</a></div>";
        } else {
            html += W.CREDIT;
        }
        page.innerHTML = html;
    }

    if (!name) {
        page.innerHTML = W.notFoundHtml("없는 유형", "메인에서 유형을 다시 골라 주세요.") + W.CREDIT;
        return;
    }

    // 소개글 번역을 못 읽어도 목록은 보여 준다.
    Promise.all([
        W.getJSON("guide/data/catalog.json"),
        W.TYPE_PAGES.indexOf(id) === -1 ? null : W.getJSON("guide/data/pages/" + id + ".json").catch(function () { return null; })
    ])
        .then(function (data) {
            render(data[0], data[1]);
        })
        .catch(function () {
            page.innerHTML = W.notFoundHtml("목록을 불러오지 못했습니다", "잠시 뒤 다시 열어 주세요.") + W.CREDIT;
        });

}());
</script>
</body>
</html>
